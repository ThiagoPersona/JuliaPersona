<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Material de estudo para o PAS/UEM - Etapa 1 (1º ano do Ensino Médio)." />
  <title>PAS/UEM 1 - Material de Estudo</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
    onerror="this.onerror=null;this.href='https://unpkg.com/docsify@4/lib/themes/vue.css'"
  />
  <style>
    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --surface-soft: #eef2f7;
      --ink: #202b38;
      --muted: #5b6b7a;
      --line: #d9e1e8;
      --accent: #1b5e8a;
      --accent-soft: #dde9f2;
      --warn: #ad6a1f;
      --danger: #a94442;
      --ok: #1c7a52;
      --sidebar: 310px;
      --content-max: 1120px;
      --pad: 34px;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body { overflow-x: hidden; }

    #app { min-height: 100vh; background: var(--bg); }

    .sidebar {
      position: fixed !important;
      inset: 0 auto 0 0;
      z-index: 20;
      width: var(--sidebar) !important;
      padding: 58px 18px 28px;
      overflow-y: auto;
      background: var(--surface-soft) !important;
      border-right: 1px solid var(--line);
      transition: transform 180ms ease;
    }

    .sidebar .app-name {
      margin: 0 0 18px;
      padding: 0 8px;
      color: var(--ink);
      font-size: 1.05rem;
      font-weight: 780;
      line-height: 1.25;
    }

    .sidebar-nav li a {
      display: block;
      min-height: 34px;
      margin: 2px 0;
      padding: 7px 10px;
      border-radius: 8px;
      color: #2c3946;
      font-size: 0.94rem;
      line-height: 1.35;
      text-decoration: none;
      white-space: normal;
    }

    .sidebar-nav li.active > a,
    .sidebar-nav li a:hover {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
    }

    .sidebar-nav > ul > li > p,
    .sidebar-nav > ul > li > a {
      margin: 0 0 10px;
      padding: 0 8px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sidebar-toggle {
      position: fixed !important;
      top: 12px !important;
      left: 14px !important;
      z-index: 35 !important;
      width: 38px !important;
      min-width: 38px !important;
      height: 38px !important;
      min-height: 38px !important;
      padding: 9px !important;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 12px 28px rgba(20, 35, 50, 0.12);
    }

    .sidebar-toggle span {
      width: 18px !important;
      height: 2px !important;
      margin-bottom: 4px !important;
      background-color: var(--ink) !important;
    }

    .content {
      position: absolute !important;
      top: 0 !important;
      right: 0 !important;
      left: var(--sidebar) !important;
      min-height: 100vh;
      margin-left: 0 !important;
      padding: 0 !important;
      background: var(--bg);
    }

    .markdown-section {
      max-width: var(--content-max) !important;
      margin: 0 auto !important;
      padding: 48px var(--pad) 88px !important;
      color: var(--ink);
      line-height: 1.66;
    }

    .markdown-section h1, .markdown-section h2, .markdown-section h3 {
      color: var(--ink);
      font-weight: 780;
      line-height: 1.24;
    }

    .markdown-section h1 {
      margin: 0 0 1.2rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--line);
      font-size: clamp(2rem, 2.6vw, 2.8rem);
    }

    .markdown-section h2 { margin-top: 2.05rem; font-size: 1.48rem; }
    .markdown-section h3 { margin-top: 1.45rem; font-size: 1.18rem; }

    .markdown-section p, .markdown-section li, .markdown-section td, .markdown-section th {
      font-size: 1.03rem;
    }

    .markdown-section a { color: var(--accent); font-weight: 650; text-underline-offset: 3px; }

    .markdown-section blockquote {
      margin: 1rem 0;
      padding: 0.85rem 1rem;
      border-left: 4px solid var(--accent);
      border-radius: 0 8px 8px 0;
      background: var(--accent-soft);
      color: #223342;
    }

    .markdown-section code { border-radius: 6px; background: #e7edf3; color: #202b38; font-size: 0.92em; }

    .markdown-section table {
      display: table;
      width: 100%;
      margin: 1rem 0 1.25rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      border-collapse: collapse;
      overflow: hidden;
    }

    .markdown-section th { background: #e5edf4; color: #1f2e3c; font-weight: 760; white-space: nowrap; }
    .markdown-section th, .markdown-section td {
      min-width: 0;
      padding: 0.66rem 0.72rem;
      border-color: var(--line);
      vertical-align: top;
      overflow-wrap: break-word;
    }
    .markdown-section tr:nth-child(even) td { background: #f7f9fb; }

    /* Quiz de somatoria (formato oficial PAS/UEM: 01/02/04/08/16) */
    .quiz-card {
      margin: 1.35rem 0;
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 10px 26px rgba(20, 35, 50, 0.06);
    }

    .quiz-source { margin-top: 0 !important; color: var(--muted); font-size: 0.92rem !important; font-weight: 700; }

    .quiz-options { display: grid; gap: 0.55rem; margin: 0.9rem 0; }

    .quiz-option {
      display: flex;
      gap: 0.62rem;
      align-items: flex-start;
      min-height: 44px;
      padding: 0.72rem 0.78rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f4f7fa;
      color: var(--ink);
      cursor: pointer;
      line-height: 1.45;
      transition: border-color 140ms ease, background 140ms ease;
    }

    .quiz-option:hover, .quiz-option.is-selected { border-color: #6ea3c4; background: var(--accent-soft); }
    .quiz-option.is-locked { cursor: default; }
    .quiz-option.is-correct { border-color: var(--ok); background: #ddf0e6; }
    .quiz-option.is-wrong { border-color: var(--danger); background: #f5e3e1; }
    .quiz-option.is-missed { border-color: var(--warn); background: #f7ecd9; }

    .quiz-option input { flex: 0 0 auto; margin-top: 0.25rem; accent-color: var(--accent); }

    .quiz-check, .quiz-reset {
      min-height: 40px;
      padding: 0.62rem 0.9rem;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      font: inherit;
      font-weight: 760;
      cursor: pointer;
    }

    .quiz-check:hover, .quiz-reset:hover { background: #144a6d; border-color: #144a6d; }
    .quiz-check:disabled, .quiz-reset:disabled { border-color: #9aa8b3; background: #9aa8b3; cursor: default; }

    .quiz-feedback { margin-top: 0.9rem; padding: 0.85rem 0.95rem; border: 1px solid var(--line); border-radius: 8px; background: #f4f7fa; }
    .quiz-feedback[hidden] { display: none !important; }
    .quiz-feedback.is-correct { border-color: var(--ok); background: #ddf0e6; }
    .quiz-feedback.is-partial { border-color: var(--warn); background: #f7ecd9; }
    .quiz-feedback.is-wrong { border-color: var(--danger); background: #f5e3e1; }
    .quiz-feedback.is-warning { border-color: var(--warn); background: #f7ecd9; }

    .quiz-score {
      display: inline-block;
      margin-bottom: 0.5rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-weight: 780;
      font-size: 0.95rem;
    }

    .quiz-explain { display: grid; gap: 0.4rem; margin: 0.72rem 0 0 !important; padding-left: 1.05rem !important; }

    .quiz-summary { margin: 1.4rem 0 1.8rem; padding: 1rem; border: 1px solid var(--line); border-radius: 8px; background: var(--accent-soft); }
    .quiz-summary h2 { margin-top: 0 !important; }
    .quiz-summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.65rem; margin: 0.8rem 0; }
    .quiz-summary-stat { padding: 0.7rem; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .quiz-summary-stat strong { display: block; color: var(--ink); font-size: 1.35rem; line-height: 1.1; }
    .quiz-summary-stat span { display: block; margin-top: 0.2rem; color: var(--muted); font-size: 0.88rem; font-weight: 700; }

    .quiz-progress { height: 10px; overflow: hidden; border-radius: 999px; background: #ccdbe6; }
    .quiz-progress span { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--accent); transition: width 180ms ease; }

    .quiz-summary-actions { display: flex; justify-content: flex-end; margin-top: 0.9rem; }
    .quiz-reset { border-color: #94a7b5; background: var(--surface); color: #2f3f4d; font-size: 0.92rem; }

    .loading-msg, .fallback-msg {
      max-width: 760px;
      margin: 4rem auto;
      padding: 1.25rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      text-align: center;
    }

    body.close .sidebar { transform: translateX(calc(-1 * var(--sidebar))); }
    body.close .content { left: 62px !important; }

    @media (max-width: 980px) {
      :root { --sidebar: clamp(260px, 82vw, 320px); --pad: 22px; }
      .content, body.close .content { left: 0 !important; width: 100% !important; }
      .sidebar { box-shadow: 18px 0 42px rgba(20, 35, 50, 0.18); }
      body.close .sidebar { transform: translateX(-100%); }
    }

    @media (max-width: 640px) {
      :root { --pad: 18px; }
      .markdown-section { padding-top: 62px !important; }
      .markdown-section h1 { font-size: 1.75rem; }
      .markdown-section table { display: block; overflow-x: auto; }
      .markdown-section th, .markdown-section td { min-width: 130px; }
      .quiz-summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body class="close">
  <div id="app">
    <div class="loading-msg">
      <p>Carregando material do PAS/UEM - Etapa 1...</p>
    </div>
  </div>

  <script src="provas-utils.js"></script>
  <script>
    function getCurrentRoute() {
      const hash = window.location.hash.replace(/^#\/?/, "").replace(/\.md$/, "");
      return hash || "README";
    }

    function getQuizStorageKey(route) {
      return `pas1-quiz:${route || getCurrentRoute()}`;
    }

    function readJson(key) {
      try { return JSON.parse(localStorage.getItem(key) || "{}"); } catch (error) { return {}; }
    }

    function writeJson(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function getQuizCardKey(card, index) {
      const source = card.querySelector(".quiz-source");
      return (source && source.textContent.trim()) || `card-${index + 1}`;
    }

    function updateQuizOptionSelection(card) {
      card.querySelectorAll(".quiz-option").forEach((option) => {
        const input = option.querySelector("input[type='checkbox']");
        option.classList.toggle("is-selected", !!input && input.checked);
      });
    }

    function scoreLabel(result) {
      if (result.hasWrongMark) return { cls: "is-wrong", text: "Zerou: marcou alternativa incorreta." };
      if (result.isFullCredit && result.score === result.max) return { cls: "is-correct", text: "Acertou em cheio!" };
      if (result.score > 0) return { cls: "is-partial", text: "Acerto parcial." };
      return { cls: "is-wrong", text: "Não marcou nenhuma alternativa correta." };
    }

    function lockQuizCard(card, selectedCodes, settings) {
      const correctCodes = window.PasQuizTools.parseCodes(card.dataset.correct);
      const result = window.PasQuizTools.scoreSomaQuestion(selectedCodes, correctCodes);
      const feedback = card.querySelector(".quiz-feedback");
      const correctSet = new Set(correctCodes);
      const selectedSet = new Set(selectedCodes);

      card.dataset.locked = "1";
      card.dataset.score = String(result.score);

      card.querySelectorAll(".quiz-option").forEach((option) => {
        const input = option.querySelector("input[type='checkbox']");
        if (!input) return;
        const code = input.value;
        input.disabled = true;
        option.classList.add("is-locked");
        const wasChecked = selectedSet.has(code);
        const isRight = correctSet.has(code);
        option.classList.toggle("is-correct", wasChecked && isRight);
        option.classList.toggle("is-wrong", wasChecked && !isRight);
        option.classList.toggle("is-missed", !wasChecked && isRight);
      });

      const button = card.querySelector(".quiz-check");
      if (button) button.disabled = true;

      if (feedback) {
        feedback.hidden = false;
        const label = scoreLabel(result);
        feedback.className = `quiz-feedback ${label.cls}`;
        const scoreBadge = document.createElement("p");
        scoreBadge.innerHTML = `<span class="quiz-score">${result.score.toFixed(1)} / ${result.max.toFixed(1)} pontos</span> ${label.text}`;
        const originalHtml = feedback.dataset.originalHtml || feedback.innerHTML;
        feedback.innerHTML = "";
        feedback.appendChild(scoreBadge);
        const rest = document.createElement("div");
        rest.innerHTML = originalHtml;
        Array.from(rest.childNodes).forEach((node) => feedback.appendChild(node));
      }

      if (settings && settings.persist) {
        const progress = readJson(settings.storageKey);
        progress[settings.cardKey] = { selected: selectedCodes.join(","), score: result.score, locked: true };
        writeJson(settings.storageKey, progress);
      }
    }

    function restoreQuizCard(card, saved) {
      if (!saved) return;
      const codes = window.PasQuizTools.parseCodes(saved.selected);
      codes.forEach((code) => {
        const input = card.querySelector(`input[type='checkbox'][value='${code}']`);
        if (input) input.checked = true;
      });
      updateQuizOptionSelection(card);
      if (saved.locked) lockQuizCard(card, codes, { persist: false });
    }

    function resetQuizProgress(section) {
      localStorage.removeItem(getQuizStorageKey());
      section.querySelectorAll(".quiz-card").forEach((card) => {
        card.dataset.locked = "0";
        card.dataset.score = "0";
        card.querySelectorAll(".quiz-option").forEach((option) => {
          option.classList.remove("is-selected", "is-locked", "is-correct", "is-wrong", "is-missed");
          const input = option.querySelector("input[type='checkbox']");
          if (input) { input.disabled = false; input.checked = false; }
        });
        const button = card.querySelector(".quiz-check");
        if (button) button.disabled = false;
        const feedback = card.querySelector(".quiz-feedback");
        if (feedback) {
          feedback.hidden = true;
          feedback.className = "quiz-feedback";
          feedback.innerHTML = feedback.dataset.originalHtml || feedback.innerHTML;
        }
      });
      updateQuizSummary();
    }

    function updateQuizSummary() {
      const section = document.querySelector(".markdown-section");
      if (!section) return;
      const summary = section.querySelector(".quiz-summary");
      const cards = Array.from(section.querySelectorAll(".quiz-card"));
      if (!summary || !cards.length) return;

      const progress = {};
      cards.forEach((card, index) => {
        if (card.dataset.locked !== "1") return;
        progress[getQuizCardKey(card, index)] = { locked: true, score: Number(card.dataset.score) || 0 };
      });

      const stats = window.PasQuizTools.getQuizProgressStats(progress, cards.length);
      const accuracy = stats.accuracy === null ? 0 : stats.accuracy;
      const note = stats.answered === stats.total
        ? `Banco concluído: ${stats.totalScore.toFixed(1)}/${stats.maxScore.toFixed(1)} pontos (${accuracy}%).`
        : `Corrigidas ${stats.answered} de ${stats.total}. Cada alternativa trava depois de corrigir.`;

      summary.innerHTML = `
        <h2>Desempenho neste banco</h2>
        <div class="quiz-summary-grid">
          <div class="quiz-summary-stat"><strong>${stats.answered}/${stats.total}</strong><span>corrigidas</span></div>
          <div class="quiz-summary-stat"><strong>${stats.totalScore.toFixed(1)}</strong><span>pontos</span></div>
          <div class="quiz-summary-stat"><strong>${stats.maxScore.toFixed(1)}</strong><span>pontos possíveis</span></div>
          <div class="quiz-summary-stat"><strong>${accuracy}%</strong><span>aproveitamento</span></div>
        </div>
        <div class="quiz-progress" aria-label="Progresso do banco"><span style="width: ${stats.completion}%"></span></div>
        <p>${note}</p>
        <div class="quiz-summary-actions">
          <button class="quiz-reset" type="button" ${stats.answered ? "" : "disabled"}>Limpar respostas deste banco</button>
        </div>
      `;

      const resetButton = summary.querySelector(".quiz-reset");
      if (resetButton) resetButton.addEventListener("click", () => resetQuizProgress(section));
    }

    function ensureQuizSummary(section, cards) {
      if (section.querySelector(".quiz-summary")) { updateQuizSummary(); return; }
      const summary = document.createElement("section");
      summary.className = "quiz-summary";
      summary.setAttribute("aria-live", "polite");
      cards[cards.length - 1].insertAdjacentElement("afterend", summary);
      updateQuizSummary();
    }

    function initQuizzes() {
      const section = document.querySelector(".markdown-section");
      const cards = Array.from(document.querySelectorAll(".quiz-card"));
      if (!section || !cards.length) return;

      const storageKey = getQuizStorageKey();
      const savedProgress = readJson(storageKey);
      ensureQuizSummary(section, cards);

      cards.forEach((card, index) => {
        if (card.dataset.quizReady === "1") return;
        const button = card.querySelector(".quiz-check");
        const feedback = card.querySelector(".quiz-feedback");
        const options = Array.from(card.querySelectorAll(".quiz-option"));
        const cardKey = getQuizCardKey(card, index);
        if (!button || !feedback || !options.length) return;
        feedback.dataset.originalHtml = feedback.innerHTML;

        options.forEach((option) => {
          const input = option.querySelector("input[type='checkbox']");
          if (!input) return;
          input.addEventListener("change", () => {
            if (feedback.classList.contains("is-warning")) {
              feedback.hidden = true;
              feedback.className = "quiz-feedback";
              feedback.innerHTML = feedback.dataset.originalHtml || feedback.innerHTML;
            }
            updateQuizOptionSelection(card);
          });
        });

        button.addEventListener("click", () => {
          if (card.dataset.locked === "1") return;
          const checked = card.querySelectorAll("input[type='checkbox']:checked");
          const codes = Array.from(checked).map((input) => input.value);
          lockQuizCard(card, codes, { persist: true, storageKey, cardKey });
          updateQuizSummary();
        });

        restoreQuizCard(card, savedProgress[cardKey]);
        card.dataset.quizReady = "1";
      });

      updateQuizSummary();
    }

    function tuneExternalLinks() {
      document.querySelectorAll('.markdown-section a[href^="http"]').forEach((link) => {
        link.setAttribute("target", "_blank");
        link.setAttribute("rel", "noopener noreferrer");
      });
    }

    function afterRender() {
      tuneExternalLinks();
      initQuizzes();
    }

    document.body.classList.toggle("close", window.innerWidth <= 980);

    window.$docsify = {
      name: "PAS/UEM 1 - Material de Estudo",
      homepage: "README.md",
      loadSidebar: "_sidebar.md",
      loadNavbar: false,
      auto2top: true,
      executeScript: true,
      maxLevel: 4,
      subMaxLevel: 0,
      relativePath: false,
      routerMode: "hash",
      alias: { "/.*/_sidebar.md": "/_sidebar.md" },
      markdown: { smartypants: false },
      plugins: [
        function(hook) {
          hook.ready(afterRender);
          hook.doneEach(afterRender);
        }
      ]
    };

    function loadScript(src, fallback) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.onload = resolve;
        script.onerror = () => {
          if (!fallback) { reject(new Error(`Falha ao carregar ${src}`)); return; }
          const fallbackScript = document.createElement("script");
          fallbackScript.src = fallback;
          fallbackScript.onload = resolve;
          fallbackScript.onerror = reject;
          document.head.appendChild(fallbackScript);
        };
        document.head.appendChild(script);
      });
    }

    loadScript(
      "https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js",
      "https://unpkg.com/docsify@4/lib/docsify.min.js"
    );

    window.setTimeout(() => {
      const app = document.getElementById("app");
      if (!app || document.querySelector(".markdown-section")) return;
      app.innerHTML = `
        <div class="fallback-msg">
          <p>O leitor está demorando para carregar.</p>
          <p><a href="README.md">Abrir página inicial em Markdown</a></p>
          <p><a href="javascript:location.reload()">Recarregar</a></p>
        </div>
      `;
    }, 12000);
  </script>
</body>
</html>
